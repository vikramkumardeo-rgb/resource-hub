services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hubuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hubpass}
      POSTGRES_DB: ${POSTGRES_DB:-resourcehub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hubuser} -d ${POSTGRES_DB:-resourcehub}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hubuser}:${POSTGRES_PASSWORD:-hubpass}@db:5432/${POSTGRES_DB:-resourcehub}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key-please-change-me-0123456789}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: 
      - "5173:80"
    depends_on:
      - backend
volumes:
    pgdata:

