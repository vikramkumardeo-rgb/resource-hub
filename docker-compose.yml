services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hubuser
      POSTGRES_PASSWORD: hubpass
      POSTGRES_DB: resourcehub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubuser -d resourcehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://hubuser:hubpass@db:5432/resourcehub
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: